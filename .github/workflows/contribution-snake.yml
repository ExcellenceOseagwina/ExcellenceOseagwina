name: Update contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: ExcellenceOseagwina
          outputs: |
            dist/excellence-oseagwina-contribution-grid-snake.svg
            dist/excellence-oseagwina-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Save generated contribution graphics
        run: |
          mkdir -p assets
          cp dist/excellence-oseagwina-contribution-grid-snake.svg assets/
          cp dist/excellence-oseagwina-contribution-grid-snake-dark.svg assets/
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/excellence-oseagwina-contribution-grid-snake.svg assets/excellence-oseagwina-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update contribution snake"
          git push

