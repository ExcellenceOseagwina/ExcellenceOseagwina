name: Update GitHub stats card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_stats.py"
      - "tests/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - "docs/**"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q generate_stats.py tests scripts
      - name: Run Ruff
        run: ruff check --select E4,E7,E9,F generate_stats.py tests scripts
      - name: Run Bandit
        run: bandit -q -r generate_stats.py tests scripts
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  generate:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v5
        with:
          python-version: "3.12"
      - name: Install SVG validation dependency
        run: python -m pip install --disable-pip-version-check defusedxml
      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ExcellenceOseagwina
          TZ_OFFSET_HOURS: "1"
          OUT: stats.svg
        run: python generate_stats.py
      - name: Validate generated SVG
        run: python scripts/validate_svg.py stats.svg
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats card"
          git pull --rebase origin main
          git push
