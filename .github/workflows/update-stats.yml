name: Update GitHub stats card

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "generate_stats.py"
      - "tests/**"
      - "docs/stats-generator.md"
      - ".github/workflows/update-stats.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q generate_stats.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ExcellenceOseagwina
          TZ_OFFSET_HOURS: "1"
          OUT: stats.svg
        run: python generate_stats.py
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats card"
          git push
