        </line>
      </g>
      <text x="126" y="58" font-size="20" font-weight="700" fill="#ffffff">Ethical Hacking</text>
      <text x="126" y="82" font-size="13.5" fill="#a9b4e6">Penetration testing and</text>
      <text x="126" y="101" font-size="13.5" fill="#a9b4e6">vulnerability assessment</text>
    </g></g>

    <!-- DL -->
    <g transform="translate(800 170)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
