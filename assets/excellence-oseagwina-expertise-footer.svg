      <rect x="1" y="1" width="338" height="4" rx="2" fill="url(#brand)" opacity="0.8"/>
      <g transform="translate(66 65)"><use xlink:href="#badge"/>
        <g stroke="#8b9cff" stroke-opacity="0.7" stroke-width="1.2">
          <path d="M-18 -12L0 -14M-18 -12L0 0M-18 -12L0 14M-18 0L0 -14M-18 0L0 0M-18 0L0 14M-18 12L0 -14M-18 12L0 0M-18 12L0 14M0 -14L18 -6M0 0L18 -6M0 14L18 -6M0 -14L18 6M0 0L18 6M0 14L18 6"/>
        </g>
        <g fill="#5eead4"><circle cx="-18" cy="-12" r="3.2"/><circle cx="-18" cy="0" r="3.2"/><circle cx="-18" cy="12" r="3.2"/></g>
        <g fill="#8b9cff"><circle cx="0" cy="-14" r="3.2"/><circle cx="0" cy="0" r="3.2"><animate attributeName="r" values="3.2;5;3.2" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="0" cy="14" r="3.2"/></g>
        <g fill="#c084fc"><circle cx="18" cy="-6" r="3.4"/><circle cx="18" cy="6" r="3.4"/></g>
      </g>
