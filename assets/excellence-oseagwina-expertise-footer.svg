      <rect width="340" height="130" rx="18" fill="url(#card)" stroke="#8b9cff" stroke-opacity="0.35" filter="url(#shadow)"/>
      <rect x="1" y="1" width="338" height="4" rx="2" fill="url(#brand)" opacity="0.8"/>
      <g transform="translate(66 65)"><use xlink:href="#badge"/>
        <g stroke="#5eead4" stroke-width="2" stroke-linecap="round" fill="none">
          <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#0b1026"/>
          <path d="M-8 -14v-6M0 -14v-6M8 -14v-6M-8 14v6M0 14v6M8 14v6M-14 -8h-6M-14 0h-6M-14 8h-6M14 -8h6M14 0h6M14 8h6"/>
        </g>
        <text y="5" font-size="13" font-weight="800" fill="#c084fc" text-anchor="middle"><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>SEC</text>
      </g>
      <text x="126" y="58" font-size="20" font-weight="700" fill="#ffffff">Cybersecurity</text>
      <text x="126" y="82" font-size="13.5" fill="#a9b4e6">Secure applications and systems that</text>
      <text x="126" y="101" font-size="13.5" fill="#a9b4e6">remain reliable and protect data</text>
    </g></g>

    <!-- ML -->
