<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-labelledby="t d">
  <title id="t">Excellence Oseagwina</title>
  <desc id="d">Cybersecurity engineer in progress: ethical hacking, penetration testing and secure web development.</desc>
  <style>
    :root {
      --bg1: #F7FAFC; --bg2: #E8F1F8;
      --card: #FFFFFF; --border: #D5E0EA;
      --ink: #0F1B2D; --muted: #52657A;
      --accent: #0B7A5C; --accent2: #1D6FD8;
      --chip: #EAF6F1; --chip-b: #BFE3D5; --chip-t: #0B6B51;
      --grid: #0F1B2D;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #0B1220; --bg2: #101C30;
        --card: #111B2E; --border: #243552;
        --ink: #F1F5FA; --muted: #9FB1C7;
        --accent: #2EE6A6; --accent2: #6CB2FF;
        --chip: #0F2A26; --chip-b: #1D5A4C; --chip-t: #7DF0C6;
        --grid: #FFFFFF;
      }
    }
    .bg1 { stop-color: var(--bg1); } .bg2 { stop-color: var(--bg2); }
    .a1 { stop-color: var(--accent); } .a2 { stop-color: var(--accent2); }
    .card { fill: var(--card); stroke: var(--border); stroke-width: 1.5; }
    .grid { stroke: var(--grid); stroke-opacity: 0.045; stroke-width: 1; }
    .name { font: 800 54px 'Inter','Segoe UI',system-ui,-apple-system,sans-serif; fill: var(--ink); letter-spacing: -1.2px; }
    .role { font: 600 22px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--accent2); }
    .sub  { font: 400 16px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--muted); }
    .mono { font: 600 13px 'JetBrains Mono','SFMono-Regular',Consolas,monospace; fill: var(--accent); }
    .chip { fill: var(--chip); stroke: var(--chip-b); stroke-width: 1; }
    .chipt { font: 600 13px 'JetBrains Mono','SFMono-Regular',Consolas,monospace; fill: var(--chip-t); }
    .dot { fill: var(--accent); }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: 66px 62px; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" class="bg1"/>
      <stop offset="1" class="bg2"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" class="a1"/>
      <stop offset="1" class="a2"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g>
    <path class="grid" d="M0 40H900M0 80H900M0 120H900M0 160H900M0 200H900M0 240H900"/>
    <path class="grid" d="M60 0V280M120 0V280M180 0V280M240 0V280M300 0V280M360 0V280M420 0V280M480 0V280M540 0V280M600 0V280M660 0V280M720 0V280M780 0V280M840 0V280"/>
  </g>

  <rect x="24" y="24" width="852" height="232" rx="14" class="card"/>
  <rect x="24" y="24" width="8" height="232" rx="4" fill="url(#bar)"/>

  <!-- status line -->
  <circle cx="66" cy="62" r="5" class="dot pulse"/>
  <text x="82" y="67" class="mono">~$ whoami  //  still growing</text>

  <!-- name + role -->
  <text x="60" y="130" class="name">Excellence Oseagwina</text>
  <text x="60" y="166" class="role">Cybersecurity Engineer in progress</text>
  <text x="60" y="194" class="sub">Ethical hacking · Penetration testing · Secure web development</text>

  <!-- chips -->
  <g transform="translate(60,216)">
    <rect width="150" height="28" rx="14" class="chip"/>
    <text x="75" y="19" text-anchor="middle" class="chipt">B.Sc. Cyber Security</text>
    <rect x="162" width="132" height="28" rx="14" class="chip"/>
    <text x="228" y="19" text-anchor="middle" class="chipt">Edo, Nigeria</text>
    <rect x="306" width="150" height="28" rx="14" class="chip"/>
    <text x="381" y="19" text-anchor="middle" class="chipt">Python · JavaScript</text>
  </g>

  <!-- shield mark -->
  <g transform="translate(724,70)">
    <path d="M60 0 L120 22 V72 C120 112 92 140 60 156 C28 140 0 112 0 72 V22 Z" fill="url(#bar)" opacity="0.14"/>
    <path d="M60 10 L110 28 V72 C110 105 87 129 60 143 C33 129 10 105 10 72 V28 Z" fill="none" stroke="url(#bar)" stroke-width="3"/>
    <rect x="40" y="64" width="40" height="34" rx="6" fill="url(#bar)"/>
    <path d="M47 64 V54 a13 13 0 0 1 26 0 V64" fill="none" stroke="url(#bar)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="60" cy="80" r="4" fill="var(--card)"/>
  </g>
</svg>
