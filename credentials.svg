<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" role="img" aria-labelledby="t d">
  <title id="t">Credentials - Excellence Oseagwina</title>
  <desc id="d">B.Sc. Cyber Security from Wellspring University, with focus areas in ethical hacking, network security and secure software development.</desc>
  <style>
    :root {
      --bg: #FFFFFF; --border: #D5E0EA; --panel: #F4F8FB;
      --ink: #0F1B2D; --muted: #52657A; --accent: #0B7A5C; --accent2: #1D6FD8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1829; --border: #243552; --panel: #131F35;
        --ink: #F1F5FA; --muted: #9FB1C7; --accent: #2EE6A6; --accent2: #6CB2FF;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .tag { font: 600 12px 'JetBrains Mono',Consolas,monospace; fill: var(--accent); letter-spacing: 1.5px; }
    .h  { font: 700 17px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--ink); }
    .m  { font: 400 14px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--muted); }
    .k  { font: 600 11.5px 'JetBrains Mono',Consolas,monospace; fill: var(--accent2); letter-spacing: 1px; }
    .ic { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect x="1" y="1" width="898" height="228" rx="16" class="card"/>
  <text x="32" y="44" class="tag">CREDENTIALS</text>

  <!-- card 1: education -->
  <rect x="32" y="62" width="268" height="132" rx="12" class="panel"/>
  <g transform="translate(52,82)">
    <path class="ic" d="M2 10 L16 3 L30 10 L16 17 Z"/>
    <path class="ic" d="M8 13.5 V21 C8 23 12 25 16 25 C20 25 24 23 24 21 V13.5"/>
  </g>
  <text x="52" y="136" class="k">EDUCATION</text>
  <text x="52" y="158" class="h">B.Sc. Cyber Security</text>
  <text x="52" y="179" class="m">Wellspring University, Nigeria</text>

  <!-- card 2: offensive -->
  <rect x="316" y="62" width="268" height="132" rx="12" class="panel"/>
  <g transform="translate(336,82)">
    <path class="ic" d="M16 3 L28 7 V16 C28 22 22 26 16 29 C10 26 4 22 4 16 V7 Z"/>
    <path class="ic" d="M11 15 L15 19 L22 11"/>
  </g>
  <text x="336" y="136" class="k">SPECIALIZATION</text>
  <text x="336" y="158" class="h">Ethical Hacking</text>
  <text x="336" y="179" class="m">Pentesting · Threat analysis</text>

  <!-- card 3: defensive/dev -->
  <rect x="600" y="62" width="268" height="132" rx="12" class="panel"/>
  <g transform="translate(620,82)">
    <path class="ic" d="M10 8 L3 16 L10 24"/>
    <path class="ic" d="M22 8 L29 16 L22 24"/>
    <path class="ic" d="M18 5 L14 27"/>
  </g>
  <text x="620" y="136" class="k">ENGINEERING</text>
  <text x="620" y="158" class="h">Secure Development</text>
  <text x="620" y="179" class="m">Full-stack · Network security</text>
</svg>
