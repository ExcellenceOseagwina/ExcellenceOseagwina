<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-labelledby="t d">
  <title id="t">About Excellence Oseagwina</title>
  <desc id="d">Short bio and a snapshot of focus areas, languages and what is being learned right now.</desc>
  <style>
    :root {
      --bg: #FFFFFF; --border: #D5E0EA; --panel: #F4F8FB;
      --ink: #0F1B2D; --muted: #52657A; --accent: #0B7A5C; --accent2: #1D6FD8; --rule: #E3EBF2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F1829; --border: #243552; --panel: #131F35;
        --ink: #F1F5FA; --muted: #9FB1C7; --accent: #2EE6A6; --accent2: #6CB2FF; --rule: #1E2E4A;
      }
    }
    .card { fill: var(--bg); stroke: var(--border); stroke-width: 1.5; }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1; }
    .h  { font: 800 24px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--ink); letter-spacing: -.3px; }
    .tag { font: 600 12px 'JetBrains Mono',Consolas,monospace; fill: var(--accent); letter-spacing: 1.5px; }
    .p  { font: 400 15.5px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--ink); }
    .pm { font: 400 15.5px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--muted); }
    .k  { font: 600 12px 'JetBrains Mono',Consolas,monospace; fill: var(--accent2); letter-spacing: 1px; }
    .v  { font: 600 14.5px 'Inter','Segoe UI',system-ui,sans-serif; fill: var(--ink); }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>

  <rect x="1" y="1" width="898" height="298" rx="16" class="card"/>

  <!-- left: bio -->
  <text x="40" y="52" class="tag">ABOUT</text>
  <text x="40" y="86" class="h">Breaking things ethically,</text>
  <text x="40" y="114" class="h">building them securely.</text>

  <text x="40" y="154" class="p">I'm a cybersecurity graduate who enjoys testing systems for</text>
  <text x="40" y="177" class="p">weaknesses and building practical web applications with clean,</text>
  <text x="40" y="200" class="p">security-minded code.</text>

  <text x="40" y="236" class="pm">I like projects that solve a real problem end to end: auth,</text>
  <text x="40" y="259" class="pm">database, tests and a security review before shipping.</text>

  <!-- right: snapshot panel -->
  <rect x="540" y="24" width="334" height="254" rx="12" class="panel"/>
  <text x="562" y="58" class="tag">SNAPSHOT</text>

  <text x="562" y="90" class="k">FOCUS</text>
  <text x="562" y="110" class="v">Ethical hacking · Pentesting</text>
  <line x1="562" y1="122" x2="852" y2="122" class="rule"/>

  <text x="562" y="144" class="k">BUILDS WITH</text>
  <text x="562" y="164" class="v">Python · JavaScript · Node.js</text>
  <line x1="562" y1="176" x2="852" y2="176" class="rule"/>

  <text x="562" y="198" class="k">LEARNING</text>
  <text x="562" y="218" class="v">Python deep-dive · TypeScript · React</text>
  <line x1="562" y1="230" x2="852" y2="230" class="rule"/>

  <text x="562" y="250" class="k">BASE</text>
  <text x="562" y="268" class="v">Edo State, Nigeria</text>
</svg>
